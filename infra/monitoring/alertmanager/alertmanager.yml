# __BOT_TOKEN__ / __CHAT_ID__ are substituted by the alertmanager entrypoint in
# docker-compose.yml (alertmanager does not interpolate env vars itself).
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: __BOT_TOKEN__
        api_url: https://api.telegram.org
        chat_id: __CHAT_ID__
        send_resolved: true
