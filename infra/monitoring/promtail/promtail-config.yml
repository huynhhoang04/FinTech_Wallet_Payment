server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Blue/green starts the new container as <service>-green and only renames it to <service> after
      # the health gate, and promtail keeps the container name it saw first. Strip the slot suffix so
      # log queries use the logical service name instead of `audit-service-green`.
      - source_labels: [__meta_docker_container_name]
        regex: /(.*?)(-green|-old-[0-9]+)?$
        target_label: container
    pipeline_stages:
      # docker json-file wraps the app's own JSON line; unwrap it so Grafana can `| json` it
      - json:
          expressions:
            log: log
      - output:
          source: log
