groups:
  - name: financial
    rules:
      - alert: LedgerImbalance
        expr: ledger_imbalance != 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ledger imbalance - debits and credits do not cancel; money may have been created or destroyed"
      - alert: TxErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend", instance=~"transaction-engine.*", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="backend", instance=~"transaction-engine.*"}[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Transaction error rate above 2% for 5m"
      - alert: ServiceDown
        # max by (service), not per instance: blue/green moves the port, so an instance-level check would
        # fire on every deploy (the old service:port series goes stale while the new one comes up).
        expr: max by (service) (up{job="backend"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has been down for 1m"
      - alert: VpsResourcePressure
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
            or (100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VPS RAM or disk usage above 85%"
      - alert: ReconciliationStale
        expr: time() - reconciliation_last_success_timestamp_seconds > 90000
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nightly reconciliation has not succeeded for over 25h - last line of defence is silent"
