global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus-cfg/alert-rules.yml

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    metric_relabel_configs:
      # `instance` is "service:port" and blue/green changes the port on every deploy, so an up==0 alert
      # per instance fires a false ServiceDown right after each deploy (the old port's series goes
      # stale while the new port's series appears). Keep a port-free `service` label for alerting.
      - source_labels: [instance]
        regex: '([^:]+):\d+'
        target_label: service
        replacement: '$1'
    static_configs:
      - targets:
          - api-gateway:8080
          - transaction-engine:8081
          - account-ledger-service:8082
          - payment-gateway-service:8083
          - notification-service:8084
          - audit-service:8085
          - eureka-server:8761

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
