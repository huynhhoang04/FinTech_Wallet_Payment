# Optional external gRPC to the ledger. Needs a cert that covers the grpc.<domain> SAN and a
# DNS record for it (docs/09 checklist #3). Requires http2 for upstream TLS-free grpc_pass.
server {
    listen 443 ssl;
    http2 on;
    server_name grpc.*;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        grpc_pass grpc://ledger_grpc;
        error_page 502 = /error502grpc;
    }

    location = /error502grpc {
        internal;
        default_type application/grpc;
        return 204;
    }
}
