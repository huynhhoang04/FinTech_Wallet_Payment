user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON logs to stdout, shipped by promtail to loki; searchable by X-Request-Id
    log_format json_edge escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
        '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_response_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_edge;
    error_log  /dev/stderr warn;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 1m;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    include /etc/nginx/conf.d/*.conf;
}
