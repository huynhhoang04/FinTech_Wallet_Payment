spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${TX_DB:tx_db}
    username: ${POSTGRES_USER:wallet}
    password: ${POSTGRES_PASSWORD:wallet}
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka-local}@eureka-server:8761/eureka

app:
  ledger:
    grpc-address: account-ledger-service:9090
