syntax = "proto3";

package ledger.v1;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.fintech.wallet.proto.ledger";
option java_outer_classname = "LedgerProto";

service LedgerService {
  rpc PostTransfer (PostTransferRequest) returns (PostTransferResponse);
  rpc Deposit      (DepositRequest)      returns (LedgerResult);
  rpc Withdraw     (WithdrawRequest)     returns (LedgerResult);
  rpc GetBalance   (GetBalanceRequest)   returns (GetBalanceResponse);
  rpc GetStatement (GetStatementRequest) returns (GetStatementResponse);
  rpc GetAccountByNumber (GetAccountByNumberRequest) returns (AccountSummary);
  rpc GetLedgerEntries   (GetLedgerEntriesRequest)   returns (GetLedgerEntriesResponse);
}

message PostTransferRequest {
  string transaction_id = 1;
  string source_account_id = 2;
  string target_account_id = 3;
  common.v1.Money amount = 4;
  string description = 5;
}

message PostTransferResponse {
  string ledger_transaction_id = 1;
  string status = 2;
  int64 source_balance_after = 3;
  int64 target_balance_after = 4;
  string error_code = 5;
}

message DepositRequest {
  string transaction_id = 1;
  string account_id = 2;
  common.v1.Money amount = 3;
  string channel = 4;
}

message WithdrawRequest {
  string transaction_id = 1;
  string account_id = 2;
  common.v1.Money amount = 3;
  string channel = 4;
}

message LedgerResult {
  string ledger_transaction_id = 1;
  string status = 2;
  int64 balance_after = 3;
  string error_code = 4;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string account_id = 1;
  string currency = 2;
  int64 available = 3;
  int64 pending = 4;
}

message GetStatementRequest {
  string account_id = 1;
  int64 from_epoch_ms = 2;
  int64 to_epoch_ms = 3;
  int32 page = 4;
  int32 size = 5;
}

message LedgerEntryDto {
  string entry_id = 1;
  int64 amount_signed = 2;
  string direction = 3;
  int64 balance_after = 4;
  int64 at_epoch_ms = 5;
  string account_id = 6;
}

message GetStatementResponse {
  repeated LedgerEntryDto entries = 1;
  int64 opening_balance = 2;
  int64 closing_balance = 3;
}

message GetAccountByNumberRequest {
  string account_number = 1;
}

message AccountSummary {
  string account_id = 1;
  string account_number = 2;
  string currency = 3;
  string status = 4;
}

message GetLedgerEntriesRequest {
  string transaction_id = 1;
}

message GetLedgerEntriesResponse {
  repeated LedgerEntryDto entries = 1;
  int64 sum = 2;
}
