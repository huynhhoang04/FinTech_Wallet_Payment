spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${PAYMENT_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@${EUREKA_HOST}:8761/eureka

app:
  security:
    jwt-secret: ${JWT_SECRET}
  payment:
    provider-secrets:
      VNPAY: ${VNPAY_SECRET}
      STRIPE: ${STRIPE_SECRET}
      VIETQR: ${VIETQR_SECRET}
  logging:
    request-flow: false
