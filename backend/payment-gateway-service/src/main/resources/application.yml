server:
  port: 8083

spring:
  application:
    name: payment-gateway-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB:payment_db}
    username: ${POSTGRES_USER:wallet}
    password: ${POSTGRES_PASSWORD:wallet}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka-local}@${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true

app:
  internal:
    token: ${INTERNAL_TOKEN}
  security:
    jwt-secret: ${JWT_SECRET}
  payment:
    publish-enabled: true
    publish-interval-ms: 10000
    expiry-interval-ms: 60000
    demo-endpoints: true
    provider-secrets:
      VNPAY: ${VNPAY_SECRET}
      STRIPE: ${STRIPE_SECRET}
      VIETQR: ${VIETQR_SECRET}
  logging:
    request-flow: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
