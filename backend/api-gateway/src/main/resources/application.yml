server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              # Backend Tomcats close idle keep-alive connections (~20s). Without this, the
              # gateway reuses a connection the server already closed and the first request
              # after an idle gap dies with PrematureCloseException -> 500.
              max-idle-time: 10s
              eviction-interval: 5s
          # Belt and braces for the same failure: a GET that hits a doomed connection is retried
          # instead of surfacing a 500. Reads are idempotent; POSTs are excluded on purpose
          # (posting calls must never be retried - docs 04 section 4.1).
          default-filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                series: SERVER_ERROR
                exceptions: java.io.IOException,reactor.netty.http.client.PrematureCloseException,reactor.core.Exceptions$ReactiveException
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth
              uri: lb://account-ledger-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 10
            - id: transactions
              uri: lb://transaction-engine
              predicates:
                - Path=/api/v1/transactions/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: CircuitBreaker
                  args:
                    name: transactionEngineCircuitBreaker
            - id: accounts
              uri: lb://transaction-engine
              predicates:
                - Path=/api/v1/accounts/**
            - id: payments
              uri: lb://payment-gateway-service
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: webhooks
              uri: lb://payment-gateway-service
              predicates:
                - Path=/webhooks/**
            - id: notifications
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true

app:
  security:
    jwt-secret: ${JWT_SECRET}
  hmac:
    secret: ${HMAC_SECRET}
    max-skew-seconds: ${HMAC_MAX_SKEW_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
