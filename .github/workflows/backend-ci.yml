name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/**']
  pull_request:
    paths: ['backend/**']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # runners are ephemeral: no reaper needed, and it saves a docker hub pull that
      # can hit the shared-IP unauthenticated rate limit
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build + unit + integration tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Trivy - dependency vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
            backend/**/target/site/jacoco
          if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Gitleaks - block committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app-check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/web } }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/web/package-lock.json }

      - run: npm ci || npm install

      - run: npx tsc --noEmit
