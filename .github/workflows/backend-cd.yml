name: backend-cd

on:
  push:
    branches: [main]
    # .github/workflows too: a change to the deploy pipeline has to be exercised by the pipeline
    # that owns it, otherwise a broken deploy job is only discovered on the next service change.
    paths: ['backend/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services to deploy (empty = all seven)'
        required: false
        default: 'eureka-server account-ledger-service transaction-engine api-gateway payment-gateway-service notification-service audit-service'
        type: string

concurrency:
  group: backend-cd-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }

      - working-directory: backend
        run: ./mvnw -B verify

  changes:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}
      services_json: ${{ steps.diff.outputs.services_json }}
    steps:
      - uses: actions/checkout@v4
        # 0, not 2: the whole push range has to be reachable, not just its last commit
        with: { fetch-depth: 0 }

      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVICES_OVERRIDE: ${{ inputs.services }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          # dependency order: eureka first, then the ledger tx-engine calls over gRPC,
          # then the edge and the consumers
          ALL="eureka-server account-ledger-service transaction-engine api-gateway payment-gateway-service notification-service audit-service"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # manual run: an empty box means "place the whole stack", never "deploy nothing"
            SERVICES="${SERVICES_OVERRIDE:-$ALL}"
          else
            # Diff the whole push, not only its last commit: HEAD~1..HEAD silently skipped every
            # module touched by an earlier commit of the same push, so a two-commit push built and
            # deployed just the second one.
            BASE="${PUSH_BEFORE:-}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            # proto/ or common/ changed -> rebuild every service (they are -am deps of all of them)
            CHANGED=$(git diff --name-only "$BASE" "${PUSH_HEAD:-HEAD}" | sed 's|^backend/||' | cut -d/ -f1 | sort -u)
            if echo "$CHANGED" | grep -qE '^(proto|common)$'; then
              SERVICES="$ALL"
            else
              SERVICES=$(echo "$CHANGED" | grep -E '^(eureka-server|api-gateway|transaction-engine|account-ledger-service|payment-gateway-service|notification-service|audit-service)$' | tr '\n' ' ')
            fi
          fi
          SERVICES=$(echo $SERVICES | xargs)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          # printf, not echo: `jq -R -s` keeps echo's trailing newline, which would land
          # inside the last matrix value and truncate the ./mvnw command line.
          echo "services_json=$(printf '%s' "$SERVICES" | jq -R -s -c 'split(" ") | map(select(length>0))')" >> "$GITHUB_OUTPUT"

  build-push:
    needs: changes
    if: needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services_json) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }

      - name: Jib build + push (tag = git SHA, latest tag inherited from parent POM)
        working-directory: backend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR only accepts lowercase image names
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fintech-wallet"
          # `package` must precede `jib:build`: a bare jib:build runs no lifecycle, so on a
          # clean checkout there is no target/classes and jib fails with "Obtaining project
          # build output files failed". Tests already ran in the verify job.
          ./mvnw -B -pl ${{ matrix.service }} -am -DskipTests package jib:build \
            -Djib.to.image=${IMAGE_PREFIX}-${{ matrix.service }}:${{ github.sha }} \
            -Djib.to.auth.username=${{ github.actor }} \
            -Djib.to.auth.password=$GHCR_TOKEN

  deploy:
    needs: [build-push, changes]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The VPS answers on no port at all from outside Vietnam, and Microsoft's anycast range
      # is blocked too, so neither SSH nor a self-hosted runner can reach it. The only usable
      # path in is the Cloudflare tunnel, so the deploy is triggered over HTTPS and
      # infra/scripts/deploy-hook.py runs deploy.sh on the far side.
      - name: Deploy each service through the deploy hook
        env:
          HOOK_URL: https://${{ secrets.PUBLIC_DOMAIN }}/deploy-hook
          HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          set -euo pipefail
          # One deploy can outlive Cloudflare's 100s origin timeout, so start a job and poll.
          for SVC in ${{ needs.changes.outputs.services }}; do
            echo "=== $SVC ==="
            ID=$(curl -fsS -X POST "$HOOK_URL/deploy" \
                   -H "Authorization: Bearer $HOOK_TOKEN" \
                   -H 'Content-Type: application/json' \
                   -d "{\"service\":\"$SVC\",\"sha\":\"${{ github.sha }}\"}" | jq -r .id)
            for _ in $(seq 1 180); do
              BODY=$(curl -fsS "$HOOK_URL/status/$ID")
              STATE=$(jq -r .state <<<"$BODY")
              [ "$STATE" = "running" ] || break
              sleep 5
            done
            jq -r .log <<<"$BODY"
            [ "$STATE" = "done" ] || { echo "DEPLOY FAILED: $SVC"; exit 1; }
          done

      - name: Smoke test through nginx
        run: |
          curl -fsS --retry 5 --retry-delay 3 "https://${{ secrets.PUBLIC_DOMAIN }}/actuator/health" \
            | grep -q '"status":"UP"'
          curl -fsS "https://${{ secrets.PUBLIC_DOMAIN }}/api/v1/auth/login" -o /dev/null -w '%{http_code}' \
            | grep -qE '400|405'

      - name: Notify Telegram
        if: always()
        run: |
          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="backend-cd ${{ job.status }} — ${{ github.sha }} — services: ${{ needs.changes.outputs.services }}"
